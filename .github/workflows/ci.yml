name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fake indicators and fixtures only; no network, no host scan)
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke (help + iOS guard)
        shell: bash
        run: |
          python -m rocs --help
          python -m rocs scan --platform ios --out - || test $? -eq 3
